        '200':
          description: 当前 owner 的不可变安装列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentPackageInstallation'
    post:
      summary: 原子安装当前 owner 的不可变 .fmbook 版本
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 新内容包安装完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPackageInstallResult'
        '200':
          description: 相同 owner/内容哈希已存在，返回同一安装
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPackageInstallResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 内容包超过 50 MiB
