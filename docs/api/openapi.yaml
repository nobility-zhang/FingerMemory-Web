          $ref: '#/components/schemas/AdventureRun'
    AdventureEncounter:
      type: object
      additionalProperties: false
      required: [outcome, battleId, runId, runVersion]
      properties:
        outcome:
          type: string
          enum: [started, existing]
        battleId:
          type: string
        runId:
          type: string
        runVersion:
          type: integer
          minimum: 0
    AdventureRecollection:
      type: object
      additionalProperties: false
      required:
        - key
        - namespace
        - bookId
        - chapterId
        - title
        - speaker
        - text
        - unlockedAtMs
      properties:
        key:
          type: string
        namespace:
          type: string
        bookId:
          type: string
        chapterId:
          type: string
        title:
          type: string
        speaker:
          type: string
        text:
          type: string
        unlockedAtMs:
          type: integer
          minimum: 0
    ContentPackagePreview:
      type: object
      additionalProperties: false
      required:
        - fileName
        - title
        - namespace
        - bookId
        - contentVersion
        - contentHash
        - engineVersion
        - entryNodeId
        - wordCount
        - chapterCount
        - nodeCount
        - characterCount
        - cardCount
        - encounterCount
        - assetCount
        - warnings
      properties:
        fileName:
          type: string
        title:
          type: string
        namespace:
          type: string
        bookId:
          type: string
        contentVersion:
          type: string
        contentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        engineVersion:
          type: string
        entryNodeId:
          type: string
        wordCount:
          type: integer
          minimum: 1
        chapterCount:
          type: integer
          minimum: 1
        nodeCount:
          type: integer
          minimum: 1
        characterCount:
          type: integer
          minimum: 0
        cardCount:
          type: integer
          minimum: 0
        encounterCount:
          type: integer
          minimum: 0
        assetCount:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string
    ContentPackageInstallation:
      type: object
      additionalProperties: false
      required:
        - id
        - namespace
        - bookId
        - contentVersion
        - contentHash
        - title
        - entryNodeId
        - status
        - wordCount
        - chapterCount
        - nodeCount
        - characterCount
        - cardCount
        - encounterCount
        - assetCount
        - installedAtMs
      properties:
        id:
          type: string
          maxLength: 36
        namespace:
          type: string
        bookId:
          type: string
        contentVersion:
          type: string
        contentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        title:
          type: string
        entryNodeId:
          type: string
        status:
          type: string
          enum: [installed]
        wordCount:
          type: integer
        chapterCount:
          type: integer
        nodeCount:
          type: integer
        characterCount:
          type: integer
        cardCount:
          type: integer
        encounterCount:
          type: integer
        assetCount:
          type: integer
        installedAtMs:
          type: integer
          minimum: 0
    ContentPackageInstallResult:
      type: object
      additionalProperties: false
      required: [outcome, installation]
      properties:
        outcome:
          type: string
          enum: [installed, duplicate]
        installation:
          $ref: '#/components/schemas/ContentPackageInstallation'
    SnapshotCounts:
      type: object
      additionalProperties:
        type: integer
    MigrationPreview:
      type: object
      required:
        [snapshotFingerprint, targetDataVersion, counts, schedulerPackageVersion, schedulerModelVersion, schedulerWeights]
      properties:
        snapshotFingerprint:
          type: string
        targetDataVersion:
          type: integer
        counts:
          $ref: '#/components/schemas/SnapshotCounts'
        schedulerPackageVersion:
          type: string
        schedulerModelVersion:
          type: string
        schedulerWeights:
          type: integer
    MigrationResult:
      type: object
      required: [batchId, snapshotFingerprint, dataVersion, importedCounts, idMappings]
      properties:
        batchId:
          type: string
        snapshotFingerprint:
          type: string
        dataVersion:
          type: integer
        importedCounts:
          $ref: '#/components/schemas/SnapshotCounts'
        idMappings:
          type: integer
    AccountBackup:
      type: object
      required: [backupVersion, schemaVersion, dataFormatVersion, exportedAt, tables]
      additionalProperties: true
    BackupPreview:
      type: object
      required:
        [fingerprint, exportedAt, sourceDataVersion, counts, reviewReceipts, rewardEvents, migrationReceipts, idMappings]
      properties:
        fingerprint:
          type: string
        exportedAt:
          type: integer
        sourceDataVersion:
          type: integer
        counts:
          $ref: '#/components/schemas/SnapshotCounts'
        reviewReceipts:
          type: integer
        rewardEvents:
          type: integer
        migrationReceipts:
          type: integer
        idMappings:
          type: integer
    Page:
      type: object
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, 'null']
    GmContext:
      type: object
      additionalProperties: false
      required:
      - role
      - capabilities
      properties:
        role:
          type: string
          enum:
          - ADMIN
        capabilities:
          type: array
          items:
            type: string
            enum:
            - manage-users
            - manage-content
            - manage-sandboxes
            - read-audit
    GmUser:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - displayName
      - role
      - status
      - accountKind
      - version
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
        status:
          type: string
          enum:
          - active
          - disabled
        accountKind:
          type: string
          enum:
          - standard
          - test
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    GmCreateUser:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      - role
      - accountKind
      - reason
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_.-]+$"
        displayName:
          type: string
          maxLength: 80
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 另按 BCrypt 校验 UTF-8 不超过 72 字节；不得写日志。
        role:
          type: string
          enum:
          - USER
          - ADMIN
        accountKind:
          type: string
          enum:
          - standard
          - test
        reason:
          type: string
          minLength: 1
          maxLength: 300
      not:
        properties:
          accountKind:
            const: test
          role:
            const: ADMIN
        required:
        - accountKind
        - role
    GmUpdateUser:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - reason
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        reason:
          type: string
          minLength: 1
          maxLength: 300
        role:
          type: string
          enum:
          - USER
          - ADMIN
        status:
          type: string
          enum:
          - active
          - disabled
      anyOf:
      - required:
        - role
      - required:
        - status
    GmSandboxState:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - fixtureVersion
      - fixtureKey
      - currentNodeId
      - encounterId
      - clockMode
      - virtualNowMs
      - randomSeed
      - deck
      - unlockedCharacters
      - availableNodes
      - availableCards
      - availableCharacters
      properties:
        schemaVersion:
          type: integer
          minimum: 1
        fixtureVersion:
          type: integer
          minimum: 1
        fixtureKey:
          type: string
        currentNodeId:
          type: string
        encounterId:
          type: [string, 'null']
        clockMode:
          type: string
          enum:
          - fixed
          - real
        virtualNowMs:
          type: [integer, 'null']
          minimum: 0
        randomSeed:
          type: integer
        deck:
          type: array
          items:
            type: string
        unlockedCharacters:
          type: array
          items:
            type: string
        availableNodes:
          type: array
          items:
            type: string
        availableCards:
          type: array
          items:
            type: string
        availableCharacters:
          type: array
          items:
            type: string
    GmSandbox:
      type: object
      additionalProperties: false
      required:
      - id
      - scope
      - ownerAdminId
      - templateId
      - contentInstallationId
      - version
      - dataEpoch
      - state
      properties:
        id:
          type: string
        scope:
          type: string
          enum:
          - sandbox
        ownerAdminId:
          type: string
        templateId:
          type: string
        contentInstallationId:
          type:
          - string
          - 'null'
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        dataEpoch:
          type: string
        state:
          "$ref": "#/components/schemas/GmSandboxState"
    GmCreateSandbox:
      type: object
      additionalProperties: false
      required:
      - templateId
      - reason
      properties:
        templateId:
          type: string
        contentInstallationId:
          type:
          - string
          - 'null'
        reason:
          type: string
          minLength: 1
          maxLength: 300
    GmSandboxCommand:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - command
        - expectedVersion
        - dataEpoch
        - reason
        - args
        properties:
          command:
            const: jump-node
          expectedVersion:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          dataEpoch:
            type: string
          reason:
            type: string
            minLength: 1
            maxLength: 300
          args:
            type: object
            additionalProperties: false
            required:
            - nodeId
            properties:
              nodeId:
                type: string
                minLength: 1
      - type: object
        additionalProperties: false
        required:
        - command
        - expectedVersion
        - dataEpoch
        - reason
        - args
        properties:
          command:
            const: grant-cards
          expectedVersion:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          dataEpoch:
            type: string
          reason:
            type: string
            minLength: 1
            maxLength: 300
          args:
            type: object
            additionalProperties: false
            required:
            - cardDefinitionIds
            properties:
              cardDefinitionIds:
                type: array
                minItems: 1
                maxItems: 18
                items:
                  type: string
                  minLength: 1
      - type: object
        additionalProperties: false
        required:
        - command
        - expectedVersion
        - dataEpoch
        - reason
        - args
        properties:
          command:
            const: unlock-character
          expectedVersion:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          dataEpoch:
            type: string
          reason:
            type: string
            minLength: 1
            maxLength: 300
          args:
            type: object
            additionalProperties: false
            required:
            - characterKey
            properties:
              characterKey:
                type: string
                minLength: 1
      - type: object
        additionalProperties: false
        required:
        - command
        - expectedVersion
        - dataEpoch
        - reason
        - args
        properties:
          command:
            const: set-clock
          expectedVersion:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          dataEpoch:
            type: string
          reason:
            type: string
            minLength: 1
            maxLength: 300
          args:
            type: object
            additionalProperties: false
            required:
            - mode
            properties:
              mode:
                type: string
                enum:
                - fixed
                - real
              nowMs:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            oneOf:
            - properties:
                mode:
                  const: fixed
              required:
              - nowMs
            - properties:
                mode:
                  const: real
              not:
                required:
                - nowMs
      - type: object
        additionalProperties: false
        required:
        - command
        - expectedVersion
        - dataEpoch
        - reason
        - args
        properties:
          command:
            const: reset-sandbox
          expectedVersion:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          dataEpoch:
            type: string
          reason:
            type: string
            minLength: 1
            maxLength: 300
          args:
            type: object
            additionalProperties: false
            required: []
            properties: {}
    GmCommandReceipt:
      type: object
      additionalProperties: false
      required:
      - commandId
      - status
      - scope
      - sandbox
      properties:
        commandId:
          type: string
        status:
          type: string
          enum:
          - applied
          - duplicate
        scope:
          type: string
          enum:
          - sandbox
        sandbox:
          "$ref": "#/components/schemas/GmSandbox"
    GmContentAction:
      type: object
      additionalProperties: false
      required:
      - action
      - expectedContentHash
      - reason
      properties:
        action:
          type: string
          enum:
          - validate
          - publish
          - archive
        expectedContentHash:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
          maxLength: 300
    GmContentStatus:
      type: object
      additionalProperties: false
      required:
      - id
      - bookId
      - contentVersion
      - contentHash
      - status
      - issues
      properties:
        id:
          type: string
        bookId:
          type: string
        contentVersion:
          type: string
        contentHash:
          type: string
        status:
          type: string
          enum:
          - draft
          - validated
          - published
          - archived
        issues:
          type: array
          items:
            type: string
    GmAuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - actorId
      - action
      - targetId
      - scope
      - occurredAtMs
      - requestId
      - reason
      - outcome
      properties:
        id:
          type: string
        actorId:
          type: string
        action:
          type: string
        targetId:
          type:
          - string
          - 'null'
        scope:
          type: string
        occurredAtMs:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        requestId:
          type: string
        reason:
          type: string
        outcome:
          type: string
          enum:
          - success
          - rejected
          - failed
    GmUserPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/GmUser"
        nextCursor:
          type:
          - string
          - 'null'
    GmSandboxPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/GmSandbox"
        nextCursor:
          type:
          - string
          - 'null'
    GmContentPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/GmContentStatus"
        nextCursor:
          type:
          - string
          - 'null'
    GmAuditPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/GmAuditEvent"
        nextCursor:
          type:
          - string
          - 'null'
  responses:
    Unauthorized:
      description: 未认证或会话过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: CSRF、权限或安全策略拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: 输入校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 幂等冲突、版本冲突或业务唯一约束冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 当前用户范围内资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
paths:
  /auth/csrf:
    get:
      summary: 获取当前会话 CSRF token
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
  /auth/register:
    post:
      summary: 注册普通用户
      security: []
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 用户创建成功，尚未自动登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      summary: 使用用户名和密码建立 HttpOnly 会话
      security: []
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 登录成功，返回当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: 注销当前 Web 会话
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: 会话已失效
  /auth/me:
    get:
      summary: 读取当前认证用户
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password:
    post:
      summary: 修改当前用户密码
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 密码已更新
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/tokens:
    get:
      summary: 列出当前用户的 CLI 访问令牌元数据
      x-implementation-status: planned
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 令牌列表，不返回摘要或明文
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      summary: 创建可过期、可撤销的 CLI 访问令牌
      x-implementation-status: planned
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: 只在该响应返回一次令牌明文
  /auth/tokens/{id}:
    delete:
      summary: 撤销当前用户的 CLI 访问令牌
      x-implementation-status: planned
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: 令牌已撤销
  /preferences:
    get:
      summary: 读取当前用户偏好
      x-implementation-status: planned
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: 用户偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
    put:
      summary: 更新当前用户偏好
      x-implementation-status: planned
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: 更新后的偏好
  /lexicons:
    get:
      summary: 列出当前用户词库
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 当前用户词库
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lexicon'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: 创建当前用户的私人词库
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LexiconCreate'
      responses:
        '201':
          description: 创建的词库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lexicon'
        '409':
          $ref: '#/components/responses/Conflict'
  /lexicons/{id}:
    get:
      summary: 读取当前用户的一个词库
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
