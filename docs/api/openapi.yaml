openapi: 3.1.0
info:
  title: FingerMemory API
  version: 0.2.0
  description: |
    FingerMemory Web 与 CLI 的共享 HTTP 契约。所有时间为 UTC epoch 毫秒，ID 为不透明字符串。
    P2 已实现在线队列、服务端会话、正式复习、本地 v4/v5 迁移和用户级备份；
    P3 增加游戏流程使用的练习完成命令和共享快捷键契约。
    H0-04 已实现默认管理员一次性初始化、首次改密门禁和 GM 账号/审计基础。
    H3-03 已实现账号模式 card-battle-v1 创建、唯一学习授能、出牌、伙伴技能和结束回合命令。
    H3-04 已实现本人隔离 GM sandbox、固定夹具命令、epoch/version 幂等和审计。
    H5-02 已实现已安装 .fmbook 的固定版本冒险、剧情动作、遭遇绑定和保存恢复。
    H5-03 已实现三章旅程、三选一牌组奖励、Fina 剧情解锁/营地切换和账号级回忆去重。
    标为 implemented 的路径由当前服务提供；planned 路径在对应阶段实现前不得由客户端假定可用。
servers:
  - url: /api/v1
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: FM_SESSION
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: personal-access-token
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: Cookie 会话的状态变更请求必须携带；Bearer 请求不使用 CSRF。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: 稳定提交 ID；同 ID 同内容返回首次结果，不同内容返回冲突。
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: string
    BattleId:
      name: battleId
      in: path
      required: true
      schema:
        type: string
    AdventureRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    Csrf:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName:
          type: string
        parameterName:
          type: string
        token:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_.-]+$'
        displayName:
          type: string
          maxLength: 80
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    ArchiveLexiconRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
    UserPreferences:
      type: object
      required: [nickname, avatarKey, timezone, dailyGoal, theme, soundEnabled, shortcutsJson]
      properties:
        nickname:
          type: string
        avatarKey:
          type: string
        timezone:
          type: string
          description: IANA 时区，例如 Asia/Shanghai。
        dailyGoal:
          type: integer
          minimum: 1
          maximum: 1000
        theme:
          type: string
        soundEnabled:
          type: boolean
        shortcutsJson:
          type: string
          description: 版本化 JSON 字符串；P3 可升级为结构化 schema。
    User:
      type: object
      required: [id, username, displayName, preferences]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        mustChangePassword:
          type: boolean
          readOnly: true
          x-implementation-status: implemented
          description: 为 true 时，服务端仅允许读取自身状态、改密和退出；缺失视为旧客户端状态。
        preferences:
          $ref: '#/components/schemas/UserPreferences'
    Lexicon:
      type: object
      required: [id, name, description, source, archivedAtMs, createdAtMs, updatedAtMs, version]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [user, starter, migration]
        archivedAtMs:
          type: [integer, 'null']
        createdAtMs:
          type: integer
        updatedAtMs:
          type: integer
        version:
          type: integer
    LexiconCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
    LexiconUpdate:
      allOf:
        - $ref: '#/components/schemas/LexiconCreate'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 0
    ReviewRating:
      type: string
      enum: [again, hard, good, easy]
    AssessmentType:
      type: string
      enum: [typed-recall, flashcard-self-report, guided-practice]
      description: |
        typed-recall 是先隐藏答案再拼写的主动回忆；flashcard-self-report 是先回忆再翻面检查；
        guided-practice 是已看词、提示、抄写或事先曝光的练习。三者不能互相替代。
    AssessmentPolicyVersion:
      type: integer
      enum: [1, 2]
      description: |
        缺失策略字段的历史记录解释为 legacy-v1；新提交使用 2，旧日志不回算。
    AssessmentStage:
      type: string
      enum: [prompt, attempt, reveal-for-check, rate]
      description: |
        flashcard-self-report 的正式评分必须先经过 reveal-for-check；guided-practice 永远不写正式状态。
    AssessmentMetadata:
      type: object
      additionalProperties: false
      required: [assessmentType, assessmentPolicyVersion, assessmentStage, priorExposure, explicitNotRemembered]
      properties:
        assessmentType:
          $ref: '#/components/schemas/AssessmentType'
        assessmentPolicyVersion:
          $ref: '#/components/schemas/AssessmentPolicyVersion'
        assessmentStage:
          $ref: '#/components/schemas/AssessmentStage'
        priorExposure:
          type: boolean
          description: 作答前是否已看到词面、答案、提示或剧情曝光。
        explicitNotRemembered:
          type: boolean
          description: 玩家是否明确表示“没想起”；该标记只允许对应 Again。
    WordEntry:
      type: object
      required: [id, term, meaning, acceptedAnswers, hints, normalizedTerm, createdAt, updatedAt]
      properties:
        id:
          type: string
        term:
          type: string
        meaning:
          type: string
        acceptedAnswers:
          type: array
          items:
            type: string
        hints:
          type: array
          items:
            type: string
        normalizedTerm:
          type: string
        createdAt:
          type: integer
        updatedAt:
          type: integer
    StudyItem:
      type: object
      required: [id, wordEntryId, direction, createdAt, updatedAt]
      properties:
        id:
          type: string
        wordEntryId:
          type: string
        direction:
          type: string
          enum: [meaning-to-spelling]
        createdAt:
          type: integer
        updatedAt:
          type: integer
    LexiconItem:
      type: object
      required: [lexiconId, studyItemId, order, sourceHints]
      properties:
        lexiconId:
          type: string
        studyItemId:
          type: string
        order:
          type: integer
          minimum: 0
        sourceHints:
          type: array
          items:
            type: string
    WordStudyItem:
      type: object
      required: [wordEntry, studyItem]
      properties:
        wordEntry:
          $ref: '#/components/schemas/WordEntry'
        studyItem:
          $ref: '#/components/schemas/StudyItem'
        lexiconItem:
          oneOf:
            - $ref: '#/components/schemas/LexiconItem'
            - type: 'null'
        reviewState:
          type: object
          additionalProperties: true
        reviewVersion:
          type: integer
          minimum: 0
    CreateWord:
      type: object
      additionalProperties: false
      required: [term, meaning]
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 512
        meaning:
          type: string
          minLength: 1
          maxLength: 4000
        acceptedAnswers:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 512
        hints:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 2000
    QueuePlan:
      type: object
      required:
        [at, timeZone, dayStartAt, dayEndAt, settings, dueAvailableCount, newAvailableCount, selected, dataVersion]
      properties:
        at:
          type: integer
        timeZone:
          type: string
        dayStartAt:
          type: integer
        dayEndAt:
          type: integer
        settings:
          type: object
          required: [newLimit, reviewLimit, paused]
          properties:
            newLimit:
              type: integer
            reviewLimit:
              type: integer
            paused:
              type: boolean
        dueAvailableCount:
          type: integer
        newAvailableCount:
          type: integer
        selected:
          type: array
          items:
            type: object
            required: [studyItem, wordEntry, source]
            properties:
              studyItem:
                $ref: '#/components/schemas/StudyItem'
              wordEntry:
                $ref: '#/components/schemas/WordEntry'
              reviewState:
                type: object
                additionalProperties: true
              source:
                type: string
                enum: [new, review]
        dataVersion:
          type: integer
          minimum: 0
    ReviewPreview:
      type: object
      required:
        [previews, schedulerPackageVersion, schedulerModelVersion, schedulerConfigHash, reviewedAtMs, reviewVersion, sessionVersion, dataVersion]
      properties:
        previews:
          type: object
          required: [again, hard, good, easy]
          additionalProperties:
            type: object
            required: [rating, dueAt, scheduledDays]
            properties:
              rating:
                $ref: '#/components/schemas/ReviewRating'
              dueAt:
                type: integer
              scheduledDays:
                type: number
        schedulerPackageVersion:
          type: string
        schedulerModelVersion:
          type: string
        schedulerConfigHash:
          type: string
        reviewedAtMs:
          type: integer
        reviewVersion:
          type: integer
        sessionVersion:
          type: integer
        dataVersion:
          type: integer
    PracticeMode:
      type: string
      enum: [flashcard, keyboard-recall, lyrics-scroll, danmaku-stream, card-rain]
    PracticeSession:
      type: object
      required:
        [id, modeId, status, queue, currentIndex, currentStudyItemId, interactions, pendingAnswer, speed, reduceMotion, createdAt, updatedAt, pausedAt, completedAt, version]
      properties:
        id:
          type: string
        modeId:
          $ref: '#/components/schemas/PracticeMode'
        status:
          type: string
          enum: [active, paused, completed]
        queue:
          type: array
          items:
            type: object
            required: [studyItemId, source, status]
            properties:
              studyItemId:
                type: string
              source:
                type: string
                enum: [new, review, retry]
              status:
                type: string
                enum: [pending, completed, skipped]
        currentStudyItemId:
          type: [string, 'null']
        currentIndex:
          type: integer
          minimum: 0
        interactions:
          type: object
          additionalProperties: true
        pendingAnswer:
          oneOf:
            - type: object
              additionalProperties: true
              description: |
                可能携带 AssessmentMetadata 字段；缺失策略字段时按 legacy-v1 解释。
            - type: 'null'
        speed:
          type: number
        reduceMotion:
          type: boolean
        createdAt:
          type: integer
        updatedAt:
          type: integer
        pausedAt:
          type: [integer, 'null']
        completedAt:
          type: [integer, 'null']
        endedReason:
          type: [string, 'null']
          enum: [completed, abandoned, null]
        version:
          type: integer
          minimum: 0
    SessionEnvelope:
      type: object
      required: [session, items, dataVersion]
      properties:
        session:
          $ref: '#/components/schemas/PracticeSession'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WordStudyItem'
        dataVersion:
          type: integer
          minimum: 0
    CreateSession:
      type: object
      additionalProperties: false
      required: [modeId, timeZone, reduceMotion]
      properties:
        modeId:
          $ref: '#/components/schemas/PracticeMode'
        timeZone:
          type: string
        newLimit:
          type: integer
          minimum: 0
          maximum: 100
        reviewLimit:
          type: integer
          minimum: 0
          maximum: 500
        reduceMotion:
          type: boolean
    SessionPatch:
      type: object
      additionalProperties: false
      required: [expectedDataVersion, expectedVersion]
      properties:
        expectedDataVersion:
          type: integer
          minimum: 0
        expectedVersion:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [active, paused, completed]
        currentIndex:
          type: integer
          minimum: 0
        currentStudyItemId:
          type: string
        interactions:
          type: object
          additionalProperties: true
        speed:
          type: number
        reduceMotion:
          type: boolean
    PracticeResponseSubmission:
      type: object
      additionalProperties: false
      required:
        [practiceAttemptId, reviewSubmissionId, studyItemId, response, answerWasHidden, hintUsed, answerRevealed, abandoned, expectedDataVersion, expectedSessionVersion]
      properties:
        practiceAttemptId:
          type: string
        reviewSubmissionId:
          type: string
        studyItemId:
          type: string
        response:
          type: string
        answerWasHidden:
          type: boolean
        hintUsed:
          type: boolean
        answerRevealed:
          type: boolean
        assessmentType:
          $ref: '#/components/schemas/AssessmentType'
        assessmentPolicyVersion:
          $ref: '#/components/schemas/AssessmentPolicyVersion'
        assessmentStage:
          $ref: '#/components/schemas/AssessmentStage'
        priorExposure:
          type: boolean
        explicitNotRemembered:
          type: boolean
        abandoned:
          type: boolean
        expectedDataVersion:
          type: integer
        expectedSessionVersion:
          type: integer
    PracticeCompletionSubmission:
      type: object
      additionalProperties: false
      required:
        [practiceAttemptId, studyItemId, response, answerWasHidden, hintUsed, answerRevealed, abandoned, outcome, expectedDataVersion, expectedSessionVersion]
      properties:
        practiceAttemptId:
          type: string
        studyItemId:
          type: string
        response:
          type: string
        answerWasHidden:
          type: boolean
        hintUsed:
          type: boolean
        answerRevealed:
          type: boolean
        assessmentType:
          $ref: '#/components/schemas/AssessmentType'
        assessmentPolicyVersion:
          $ref: '#/components/schemas/AssessmentPolicyVersion'
        assessmentStage:
          $ref: '#/components/schemas/AssessmentStage'
        priorExposure:
          type: boolean
        explicitNotRemembered:
          type: boolean
        abandoned:
          type: boolean
        outcome:
          type: string
          enum: [completed, skipped]
        expectedDataVersion:
          type: integer
        expectedSessionVersion:
          type: integer
    ReviewSubmission:
      type: object
      additionalProperties: false
      required: [rating, expectedDataVersion, expectedReviewVersion, expectedSessionVersion, evidence]
      properties:
        rating:
          $ref: '#/components/schemas/ReviewRating'
        expectedDataVersion:
          type: integer
          minimum: 0
        expectedReviewVersion:
          type: integer
          minimum: 0
        expectedSessionVersion:
          type: integer
          minimum: 0
        evidence:
          type: object
          required: [answerWasHidden, hintUsed, answerRevealed, abandoned, userConfirmedRating]
          properties:
            answerWasHidden:
              type: boolean
            hintUsed:
              type: boolean
            answerRevealed:
              type: boolean
            assessmentType:
              $ref: '#/components/schemas/AssessmentType'
            assessmentPolicyVersion:
              $ref: '#/components/schemas/AssessmentPolicyVersion'
            assessmentStage:
              $ref: '#/components/schemas/AssessmentStage'
            priorExposure:
              type: boolean
            explicitNotRemembered:
              type: boolean
            abandoned:
              type: boolean
            userConfirmedRating:
              type: boolean
    BattleCardInstance:
      type: object
      additionalProperties: false
      required: [instanceId, definitionId]
      properties:
        instanceId:
          type: string
        definitionId:
          type: string
          enum:
            [traveler-strike, companion-guard, ember-rune, herb-pouch, observe-signpost, party-strike]
    BattleState:
      type: object
      additionalProperties: false
      required:
        [schemaVersion, battleRulesVersion, battleId, encounterId, turnId, phase, stateVersion, rngState, party, enemies, energy, drawPile, drawCursor, hand, discardPile, exhaustPile, currentIntent, intentCycle, intentIndex, terminal, learningTask, companion]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        battleRulesVersion:
          type: string
          enum: [card-battle-v1]
        battleId:
          type: string
        encounterId:
          type: string
        turnId:
          type: integer
        phase:
          type: string
          enum: [learning, player-action, victory, defeat]
        stateVersion:
          type: integer
          minimum: 0
        rngState:
          type: integer
        party:
          type: object
          additionalProperties: false
          required: [hp, maxHp, block]
          properties:
            hp:
              type: integer
            maxHp:
              type: integer
            block:
              type: integer
        enemies:
          type: array
          items:
            type: object
            additionalProperties: true
        energy:
          type: integer
        drawPile:
          type: array
          items:
            $ref: '#/components/schemas/BattleCardInstance'
        drawCursor:
          type: integer
        hand:
          type: array
          items:
            $ref: '#/components/schemas/BattleCardInstance'
        discardPile:
          type: array
          items:
            $ref: '#/components/schemas/BattleCardInstance'
        exhaustPile:
          type: array
          items:
            $ref: '#/components/schemas/BattleCardInstance'
        currentIntent:
          type: object
          additionalProperties: true
        intentCycle:
          type: array
          items:
            type: object
            additionalProperties: true
        intentIndex:
          type: integer
        terminal:
          type: [string, 'null']
          enum: [victory, defeat, null]
        learningTask:
          type: object
          additionalProperties: true
        companion:
          type: object
          additionalProperties: true
    BattleEnvelope:
      type: object
      required: [battle, events, stateVersion]
      properties:
        battle:
          $ref: '#/components/schemas/BattleState'
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        stateVersion:
          type: integer
          minimum: 0
    CreateBattle:
      type: object
      additionalProperties: false
      required: [battleId, encounterId, sessionId, studyItemId, companionKey]
      properties:
        battleId:
          type: string
          maxLength: 36
        encounterId:
          type: string
          maxLength: 64
        sessionId:
          type: string
          maxLength: 36
        studyItemId:
          type: string
          maxLength: 128
        companionKey:
          type: string
          enum: [lia, serin, fina]
        seed:
          type: integer
        shuffle:
          type: boolean
        deck:
          type: array
          minItems: 12
          maxItems: 18
          items:
            type: string
    BattleLearningClaim:
      type: object
      additionalProperties: false
      required: [expectedStateVersion, submissionId]
      properties:
        expectedStateVersion:
          type: integer
          minimum: 0
        submissionId:
          type: string
          maxLength: 128
    BattlePlayCard:
      type: object
      additionalProperties: false
      required: [expectedStateVersion, cardInstanceId]
      properties:
        expectedStateVersion:
          type: integer
          minimum: 0
        cardInstanceId:
          type: string
          maxLength: 128
        targetId:
          type: string
          maxLength: 128
    BattleCompanionSkill:
      type: object
      additionalProperties: false
      required: [expectedStateVersion]
      properties:
        expectedStateVersion:
          type: integer
          minimum: 0
    BattleEndTurn:
      type: object
      additionalProperties: false
      required: [expectedStateVersion]
      properties:
        expectedStateVersion:
          type: integer
          minimum: 0
        nextSessionId:
          type: string
          maxLength: 36
        nextStudyItemId:
          type: string
          maxLength: 128
    AdventureChoice:
      type: object
      additionalProperties: false
      required: [choiceId, label]
      properties:
        choiceId:
          type: string
        label:
          type: string
    AdventureNode:
      type: object
      additionalProperties: false
      required: [nodeId, chapterId, type, title, speaker, text, choices]
      properties:
        nodeId:
          type: string
        chapterId:
          type: string
        type:
          type: string
          enum: [dialogue, choice, explore, encounter, camp, chapter-end]
        title:
          type: string
        speaker:
          type: string
        text:
          type: string
        encounterId:
          type: string
        portraitCharacterId:
          type: string
          enum: [lia, serin, fina]
        sceneId:
          type: string
          enum:
            [inn-warm-lantern, forest-path, bridge-guardian, camp-fire, coast-beach, coast-tidepools, coast-lighthouse]
        costumeId:
          type: string
          enum: [summer-travel, beach-swimwear]
        choices:
          type: array
          items:
            $ref: '#/components/schemas/AdventureChoice'
    AdventureRewardChoice:
      type: object
      additionalProperties: false
      required: [choiceId, cardDefinitionId, name, description]
      properties:
        choiceId:
          type: string
        cardDefinitionId:
          type: string
          enum:
            [traveler-strike, companion-guard, ember-rune, herb-pouch, observe-signpost, party-strike]
        name:
          type: string
        description:
          type: string
    AdventureRewardOffer:
      type: object
      additionalProperties: false
      required: [offerId, nodeId, choices]
      properties:
        offerId:
          type: string
        nodeId:
          type: string
        choices:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/AdventureRewardChoice'
    AdventureRun:
      type: object
      additionalProperties: false
      required:
        - id
        - installationId
        - namespace
        - bookId
        - contentVersion
        - contentHash
        - title
        - companionKey
        - status
        - runVersion
        - sessionId
        - currentNode
        - deck
        - unlockedCharacters
        - flags
        - createdAtMs
        - updatedAtMs
      properties:
        id:
          type: string
        installationId:
          type: string
        namespace:
          type: string
        bookId:
          type: string
        contentVersion:
          type: string
        contentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        title:
          type: string
        companionKey:
          type: string
          enum: [lia, serin, fina]
        status:
          type: string
          enum: [active, completed]
        runVersion:
          type: integer
          minimum: 0
        sessionId:
          type: string
        battleId:
          type: string
        currentNode:
          $ref: '#/components/schemas/AdventureNode'
        deck:
          type: array
          minItems: 12
          maxItems: 18
          items:
            type: string
        unlockedCharacters:
          type: array
          items:
            type: string
            enum: [lia, serin, fina]
        rewardOffer:
          $ref: '#/components/schemas/AdventureRewardOffer'
        flags:
          type: object
          additionalProperties:
            type: boolean
        createdAtMs:
          type: integer
          minimum: 0
        updatedAtMs:
          type: integer
          minimum: 0
    AdventureStart:
      type: object
      additionalProperties: false
      required: [installationId, companionKey, reduceMotion]
