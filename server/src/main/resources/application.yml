server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none

spring:
  application:
    name: finger-memory-server
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/finger_memory?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:finger_memory}
    password: ${DB_PASSWORD:finger_memory_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never
    cookie:
      name: FM_SESSION
      http-only: true
      secure: ${SESSION_COOKIE_SECURE:false}
      same-site: lax
      path: /
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    arg-name-based-constructor-auto-mapping: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  admin:
    bootstrap:
      enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${APP_ADMIN_BOOTSTRAP_USERNAME:admin}
      password: ${APP_ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${APP_ADMIN_BOOTSTRAP_DISPLAY_NAME:管理员}
  auth:
    registration-enabled: ${REGISTRATION_ENABLED:true}
    login-attempts-per-minute: ${LOGIN_ATTEMPTS_PER_MINUTE:10}
    register-attempts-per-minute: ${REGISTER_ATTEMPTS_PER_MINUTE:5}
  fsrs:
    worker-url: ${FSRS_WORKER_URL:http://127.0.0.1:8090}
    connect-timeout-ms: ${FSRS_CONNECT_TIMEOUT_MS:500}
    request-timeout-ms: ${FSRS_REQUEST_TIMEOUT_MS:1500}
  content:
    package-root: ${CONTENT_PACKAGE_ROOT:./.local/content-packages}
    engine-version: ${CONTENT_ENGINE_VERSION:0.3.0}
